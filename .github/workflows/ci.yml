name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Documentation references resolve
        run: scripts/check-doc-references.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only embeds these; no network calls are made.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Web deployment image builds
        run: >-
          docker build -f deploy/web/Dockerfile -t love-islander-web
          --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-alpine
          --build-arg NGINX_IMAGE=public.ecr.aws/docker/library/nginx:1.27-alpine
          --build-arg VITE_SUPABASE_URL=https://example.supabase.co
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          --build-arg VITE_API_URL=https://api.example.com .

  security:
    name: Security (dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only; accepted risks in docs/security.md)
        run: npm audit --audit-level=high || echo "::warning::dev-only advisories, see docs/security.md"
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          uv export --frozen --format requirements-txt --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --progress-spinner off
      - name: no tracked files that .gitignore excludes (local caches, CLI state, downloaded photos)
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then echo "Tracked files matching .gitignore:"; echo "$tracked"; exit 1; fi
      - name: gitleaks (secrets in history; known findings baselined in .gitleaksignore)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --no-banner --redact

  database:
    name: Database (migrations + policy tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to a fresh Postgres and run policy tests
        run: supabase/test/run.sh
        env:
          # Official image via the AWS public mirror (Docker Hub rate-limits anonymous pulls on shared runners).
          POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15-alpine

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: love_islander_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/love_islander_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: Backup/restore and Supabase→Alembic copy drills
        working-directory: .
        run: |
          scripts/db/restore-drill.sh postgresql://postgres:postgres@localhost:5432/postgres
          scripts/db/copy-drill.sh postgresql://postgres:postgres@localhost:5432/postgres
      - name: Docker image builds
        run: docker build --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.12-slim -t love-islander-api .

  e2e:
    name: End-to-end (Playwright on local Supabase + API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'
      - run: npm ci
      - run: cd backend && uv sync --frozen
      - run: npm exec -w e2e -- playwright install --with-deps chromium
      - name: Start the stack and run the tests
        run: npm run test:e2e
        env:
          CI: 'true'
          POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16-alpine
          # Seed the stack with the seed accounts first (run twice, then verify). With a PEXELS_API_KEY repository
          # secret the seed uses the pinned Pexels photos; without it, generated placeholder images.
          SEED: '1'
          SEED_PLACEHOLDER_PHOTOS: 'true'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            /tmp/love-islander-e2e-api.log
            /tmp/love-islander-e2e-web.log
          retention-days: 7
